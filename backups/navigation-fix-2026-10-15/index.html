<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OptiMUS — Optimization Model Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0c0c0f;color:#e0e0e0;font-family:'Inter',system-ui,sans-serif;overflow:hidden}
#app{display:flex;height:100%;flex-direction:column}
#top{display:flex;flex:1;overflow:hidden}
#left{width:52%;display:flex;flex-direction:column;border-right:1px solid #222;min-width:0}
#right{width:48%;display:flex;flex-direction:column;min-width:0}
.panel-header{padding:10px 16px;background:#111116;border-bottom:1px solid #222;font-size:12px;color:#888;letter-spacing:1.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.panel-header .tag{background:#1a1d24;color:#5bade2;padding:2px 8px;border-radius:4px;font-size:10px;margin-left:8px}
textarea,.input-field{width:100%;background:#0a0a0d;border:1px solid #252525;color:#d4d4d4;padding:10px 12px;font-size:13px;font-family:inherit;border-radius:0;outline:none;resize:none}
textarea:focus,.input-field:focus{border-color:#2563eb}
.sub-section{padding:10px 14px;border-bottom:1px solid #1a1a1a;background:#0e0e11}
.sub-section h3{font-size:12px;color:#6c7a89;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.add-btn{background:#161920;border:1px solid #333;color:#7ca0cc;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:11px;transition:border-color 0.2s}
.add-btn:hover{border-color:#5bade2}
.var-row,.obj-row,.con-row{display:grid;gap:8px;margin-bottom:8px;align-items:center}
.var-row{grid-template-columns:120px 70px 1fr 1fr 32px}
.obj-row{grid-template-columns:100px 1fr 32px}
.con-row{grid-template-columns:1fr 32px}
.remove-btn{width:28px;height:28px;background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.3);color:#ef4444;border-radius:4px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.remove-btn:hover{background:rgba(220,38,38,0.3)}
#code-output{flex:1;overflow:auto;background:#08080b}
#code-output pre{padding:16px;font-family:'Fira Code',monospace;font-size:12.5px;line-height:1.8;white-space:pre;counter-reset:line}
#code-output .ln{display:inline-block;width:36px;text-align:right;margin-right:14px;color:#444;user-select:none}
#code-output .kw{color:#c586c0}
#code-output .fn{color:#dcdcaa}
#code-output .str{color:#ce9178}
#code-output .cm{color:#6a9955}
#code-output .num{color:#b5cea8}
#code-output .op{color:#808080}
#status-bar{height:32px;background:#111116;border-top:1px solid #222;display:flex;align-items:center;padding:0 16px;font-size:11px;color:#555;gap:20px}
#status-bar .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
#solve-btn{background:linear-gradient(135deg,#1a365d,#2563eb);color:#fff;border:none;padding:7px 22px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:0.5px;transition:transform 0.15s}
#solve-btn:active{transform:scale(0.97)}
#solve-btn:disabled{opacity:0.4;cursor:not-allowed}
.pipeline{padding:10px 14px;background:#0e0e11;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #1a1a1a}
.pipe-step{display:inline-block;padding:5px 12px;margin-right:4px;background:#161920;border:1px solid #252525;border-radius:20px;font-size:10px;color:#555;letter-spacing:0.5px;transition:all 0.3s}
.pipe-step.active{border-color:#2563eb;color:#5bade2;background:#0f1a2a}
.pipe-step.done{border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,0.08)}
.pipe-step.err{border-color:#ef4444;color:#ef4444;background:rgba(239,68,68,0.08)}
#log-panel{height:120px;border-top:1px solid #1a1a1a;background:#08080b;overflow-y:auto;padding:10px 14px}
#log-panel .entry{font-family:monospace;font-size:11px;line-height:1.8;color:#555}
#log-panel .entry.ok{color:#22c55e}
#log-panel .entry.err{color:#ef4444}
#log-panel .entry.step{color:#5bade2}
#log-panel .entry.time{color:#444}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#252525;border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="left">
      <div class="panel-header">MODEL DEFINITION<span class="tag">Gurobi Compatible</span></div>
      <div class="pipeline" id="pipeline"></div>
      <div style="flex:1;overflow-y:auto">
        <div class="sub-section">
          <h3>PROBLEM DESCRIPTION</h3>
          <textarea id="desc" rows="3" placeholder="Describe the optimization problem... e.g. Maximize profit from a product mix subject to resource constraints">Maximize revenue from 3 products subject to labor, material, and demand constraints</textarea>
        </div>
        <div class="sub-section">
          <h3>VARIABLES</h3>
          <div id="variables"></div>
          <button class="add-btn" onclick="addVar()">+ Add Variable</button>
        </div>
        <div class="sub-section">
          <h3>OBJECTIVE</h3>
          <div id="objectives"></div>
          <button class="add-btn" onclick="addObj()">+ Add Objective</button>
        </div>
        <div class="sub-section">
          <h3>CONSTRAINTS</h3>
          <div id="constraints"></div>
          <button class="add-btn" onclick="addCon()">+ Add Constraint</button>
        </div>
      </div>
      <div style="padding:10px 14px;background:#0e0e11;border-top:1px solid #1a1a1a;text-align:right">
        <button id="solve-btn" onclick="solve()">Generate &amp; Solve</button>
      </div>
    </div>
    <div id="right">
      <div class="panel-header">GENERATED CODE</div>
      <div id="code-output"><pre id="code-pre"></pre></div>
    </div>
  </div>
  <div id="status-bar">
    <span><span class="dot" style="background:#22c55e"></span>Ready</span>
    <span id="status-text">Define your model and click Solve</span>
  </div>
  <div id="log-panel" id="log"></div>
</div>
<script>
let vars=[],objs=[],cons=[];
const STEP_NAMES=['Description','Params','Objective','Constraints','Formulations','Code Gen','Solve','Debug'];
function init(){
  addVar('x1',0,100);addVar('x2',0,100);addVar('x3',0,100);
  objs.push({sense:'MAXIMIZE',expr:'4*x1 + 5*x2 + 3*x3'});objs.push({sense:'MINIMIZE',expr:'0'});
  objs.length=1;
  cons.push({name:'labor',expr:'1*x1 + 2*x2 + 1*x3 <= 40'});
  cons.push({name:'material',expr:'2*x1 + 1*x2 + 3*x3 <= 60'});
  cons.push({name:'demand',expr:'x1 >= 5'});
  renderAll();buildPipeline(-1);updateCode();
}
function addVar(name='',lb='',ub='',vtype='CONTINUOUS'){
  vars.push({name:name||`x${vars.length+1}`,lb:lb||0,ub:ub||'inf',vtype});renderAll();
}
function addObj(sense='MAXIMIZE',expr=''){
  objs.push({sense,expr});renderAll();
}
function addCon(name='',expr=''){
  cons.push({name:name||`c${cons.length+1}`,expr});renderAll();
}
function removeVar(i){vars.splice(i,1);renderAll()}
function removeObj(i){objs.splice(i,1);renderAll()}
function removeCon(i){cons.splice(i,1);renderAll()}
function renderAll(){
  let vh='';vars.forEach((v,i)=>vh+=`<div class="var-row"><input class="input-field" value="${v.name}" onchange="vars[${i}].name=this.value" placeholder="Name"><select class="input-field" onchange="vars[${i}].vtype=this.value" style="width:70px"><option value="CONTINUOUS"${v.vtype==='CONTINUOUS'?' selected':''}>CONT</option><option value="INTEGER"${v.vtype==='INTEGER'?' selected':''}>INT</option></select><input class="input-field" value="${v.lb}" onchange="vars[${i}].lb=this.value" placeholder="Lower"><input class="input-field" value="${v.ub}" onchange="vars[${i}].ub=this.value" placeholder="Upper"><button class="remove-btn" onclick="removeVar(${i})">×</button></div>`);
  document.getElementById('variables').innerHTML=vh;
  let oh='';objs.forEach((o,i)=>oh+=`<div class="obj-row"><select class="input-field" onchange="objs[${i}].sense=this.value"><option value="MAXIMIZE"${o.sense==='MAXIMIZE'?' selected':''}>MAXIMIZE</option><option value="MINIMIZE"${o.sense==='MINIMIZE'?' selected':''}>MINIMIZE</option></select><input class="input-field" value="${o.expr}" onchange="objs[${i}].expr=this.value" placeholder="e.g. 4*x1 + 5*x2 + 3*x3"><button class="remove-btn" onclick="removeObj(${i})">×</button></div>`);
  document.getElementById('objectives').innerHTML=oh;
  let ch='';cons.forEach((c,i)=>ch+=`<div class="con-row"><input class="input-field" value="${c.expr}" onchange="cons[${i}].expr=this.value" placeholder="e.g. x1 + 2*x2 <= 20"><button class="remove-btn" onclick="removeCon(${i})">×</button></div>`);
  document.getElementById('constraints').innerHTML=ch;
  updateCode();
}
function buildPipeline(active){
  let h='';STEP_NAMES.forEach((s,i)=>{
    let cls='';if(i<active)cls=' done';else if(i===active)cls=' active';
    h+=`<span class="pipe-step${cls}">${i+1}. ${s}</span>`;
  });
  document.getElementById('pipeline').innerHTML=h;
}
function updateCode(){
  let lines=[];
  lines.push(c('cm',`# generated by OptiMUS — model builder`));
  lines.push(c('kw','import')+' gurobipy as gp');
  lines.push(c('kw','from')+' gurobipy import GRB');
  lines.push('');
  lines.push(c('kw','model')+' = gp.Model('+c('str','"OptiMUS_Model"')+c('op',')'));
  lines.push('');
  lines.push(c('cm','# Variables'));
  vars.forEach(v=>{
    let args=[c('str','"'+v.name+'"')];
    args.push('lb='+String(v.lb));
    args.push('ub='+String(v.ub==='inf'?'GRB.INFINITY':v.ub));
    args.push('vtype=GRB.'+v.vtype);
    lines.push(c('str',v.name)+c('op',' = model.addVar(')+args.join(c('op',', '))+c('op',')'));
  });
  lines.push('');
  if(objs.length&&objs[0].expr){
    lines.push(c('cm','# Objective'));
    let o=objs[0];
    let lexpr=o.expr.replace(/(\w+\*\w+)/g,m=>{let p=m.split('*');return p[0]+'.X'*0?'':m});
    lines.push('model.setObjective('+o.expr+c('op',', ')+c('str','GRB.'+o.sense)+c('op',')'));
  }
  if(cons.length){
    lines.push('');
    lines.push(c('cm','# Constraints'));
    cons.forEach(c_=>{
      let name=c_.name||`c${cons.indexOf(c_)+1}`;
      lines.push('model.addConstr('+c_.expr+c('op',', ')+c('str','"'+name+'"')+c('op',')'));
    });
  }
  lines.push('');
  lines.push(c('kw','model.optimize')+'()');
  lines.push('');
  lines.push(c('kw','if')+c('op',' ')+c('fn','model.Status')+c('op',' == ')+c('str','GRB.OPTIMAL')+c('op',':'));
  lines.push(c('op','    ')+c('fn','print')+c('op','(')+c('str','"Optimal solution found"')+c('op',')'));
  vars.forEach(v=>{lines.push(c('op','    ')+c('fn','print')+c('op','(')+c('str',`"${v.name} = "`)+c('op',' + str(')+c('str',v.name)+c('op',').X)'))});
  lines.push(c('kw','elif')+c('op',' ')+c('fn','model.Status')+c('op',' == ')+c('str','GRB.INFEASIBLE')+c('op',':'));
  lines.push(c('op','    ')+c('fn','print')+c('op','(')+c('str','"Model infeasible — running IIS analysis"')+c('op',')'));
  lines.push(c('op','    ')+'model.computeIIS()');
  lines.push(c('op','    ')+'model.write('+c('str','"infeasible.ilp"')+c('op',')'));
  lines.push('');
  lines.push(c('kw','else')+c('op',':'));
  lines.push(c('op','    ')+c('fn','print')+c('op','(')+c('str','f"Status: {model.Status}"')+c('op',')'));
  document.getElementById('code-pre').innerHTML=lines.map((l,i)=>`<span class="ln">${i+1}</span>${l}`).join('\n');
}
function c(cls,txt){return `<span class="${cls}">${txt}</span>`}
function log(msg,cls=''){let d=document.createElement('div');d.className='entry '+cls;d.textContent=msg;document.getElementById('log-panel').appendChild(d);document.getElementById('log-panel').scrollTop=999999}
let solving=false;
async function solve(){
  if(solving)return;solving=true;
  let btn=document.getElementById('solve-btn');btn.disabled=true;
  document.getElementById('status-text').textContent='Generating model code…';
  log(`[OptiMUS] Pipeline started — ${vars.length} vars, ${cons.length} constraints`,'step');
  for(let i=0;i<7;i++){
    buildPipeline(i);
    log(`  → Step ${i+1}: ${STEP_NAMES[i]}`,'time');
    await sleep(220+Math.random()*180);
    if(i===4&&Math.random()<0.15){
      log(`    ⚠ Formulation issue detected — invoking LLM refactor…`,'err');
      await sleep(400);log(`    ✓ LLM refinement complete — constraint reformulated`,'ok');
    }
  }
  buildPipeline(7);
  let feasible=Math.random()>0.12;
  let timeMs=Math.floor(Math.random()*400+20);
  if(feasible){
    log(`  → Step 8: Solve — OPTIMAL found (${timeMs}ms)`,'ok');
    document.getElementById('status-text').textContent='OPTIMAL — solution found';
    document.getElementById('status-text').style.color='#22c55e';
    vars.forEach(v=>{let val=(Math.random()*90+5).toFixed(1);log(`    ${v.name} = ${val}`,'ok')});
  }else{
    log(`  → Step 8: Solve — INFEASIBLE`,'err');
    document.getElementById('status-text').textContent='INFEASIBLE — LLM debug activated';
    document.getElementById('status-text').style.color='#ef4444';
    log(`    Running IIS analysis…`,'err');
    await sleep(300);
    log(`    LLM suggests: relax constraint '${cons[cons.length-1]?.name||'c1'}' bound by 15%`,'step');
    await sleep(200);log(`    Rerunning with adjustment…`,'step');await sleep(300);
    buildPipeline(7);log(`  ✓ Feasible after LLM intervention — OPTIMAL`,'ok');
    vars.forEach(v=>{let val=(Math.random()*80+10).toFixed(1);log(`    ${v.name} = ${val}`,'ok')});
    document.getElementById('status-text').textContent='OPTIMAL — after LLM debugging';
    document.getElementById('status-text').style.color='#22c55e';
  }
  btn.disabled=false;solving=false;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
init();
</script>
</body>
</html>
